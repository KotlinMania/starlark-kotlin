org.gradle.jvmargs=-Xmx1g -Xms1g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# Kotlin/Native: one backend thread per processor core. The default of 4
# emits `w: The number of threads 4 is more than the number of processors 3`
# on the 3-vCPU macos-latest free-tier runner, which combined with
# `allWarningsAsErrors.set(true)` (set per-target via the Kotlin compiler
# options below) would turn into a hard CI failure. `0` lets the compiler
# read `Runtime.availableProcessors()` and adapts to whatever host builds.
kotlin.native.parallelThreads=0
