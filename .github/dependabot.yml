version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/vscode"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/vscode/client"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/gradle/npm/karma-webpack"
    schedule:
      interval: "weekly"
