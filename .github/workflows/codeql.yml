name: CodeQL

# CodeQL for starlark-kotlin (Kotlin Multiplatform).
#
# `actions` covers workflow files. `javascript-typescript` covers any JS/TS
# in the repo (karma config, vendored npm packages, etc.). `java-kotlin`
# runs in `manual` mode because:
#   - `autobuild` invokes `./gradlew testClasses`, which is generated by
#     a `jvm()` target block. This project has no `jvm()` target — only
#     `androidLibrary { ... }` via `com.android.kotlin.multiplatform.library`.
#     Autobuild doesn't recognise the Android-target task graph, so it
#     fails before extraction begins.
#   - `build-mode: none` produces no extractable artifacts for KMP, so
#     the extractor exits with "could not process any code written in
#     Java/Kotlin".
#
# IMPLEMENTATION STATUS (2026-05-11): the manual build below runs
# `compileAndroidMain` which DOES produce JVM `.class` files at the
# conventional `build/classes/kotlin/android/main/` path (empirically
# verified across 8+ sibling repos). However the `[KotlinExtractor]` log
# line is currently NEVER OBSERVED in any kotlinmania repo's
# `Analyze (java-kotlin)` job — the only extractor that fires is
# `PropertiesExtractor (0 bytes)`. Leading hypothesis: modern Kotlin
# Gradle Plugin routes kotlinc through the Build Tools API IN-PROCESS,
# even when `-Pkotlin.compiler.execution.strategy=out-of-process` is
# requested (the deprecation warning "Using out-of-process Kotlin
# compilation disables Build Tools API" is direct evidence). The
# LD_PRELOAD tracer never sees a `kotlinc` child process to hook, so
# nothing reaches the database. The matrix entry stays per workspace
# CLAUDE.md rule ("keep the matrix entry — fix the compile, don't
# delete the scan"); the compile-target fix is pending experimental
# validation on `threadlocal-kotlin` (which has a real `jvm()` target).
#
# Once the experiment validates a compile target that produces a
# non-zero `[KotlinExtractor] Processed N files` log line, this
# workflow will be updated to use it.
#
# `android-actions/setup-android@v3` is now declared as the SDK
# installer (workspace template-law fix #6) — removes the implicit
# dependency on `ubuntu-latest` runner-image-provided SDK.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "27 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Android SDK
        if: matrix.build-mode == 'manual'
        uses: android-actions/setup-android@v3
        # Declared SDK install — removes dependency on whatever ubuntu-latest
        # happens to pre-install. Action defaults to cmdline-tools, accepts
        # licenses, exports ANDROID_SDK_ROOT. Override packages here only if
        # the build needs API/build-tools versions other than the kotlinmania
        # convention (API 34 / build-tools 34.0.0).

      - name: Setup Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile Android + JS + Wasm Kotlin targets for CodeQL extraction
        if: matrix.build-mode == 'manual'
        shell: bash
        # `compileAndroidMain` emits JVM `.class` files at the conventional
        # `build/classes/kotlin/android/main/` path. The bytecode is where
        # CodeQL expects it. Whether the extractor's LD_PRELOAD tracer sees
        # the kotlinc invocation that produces it is the open question —
        # current observation across the workspace is that it does not,
        # likely because modern KGP routes through Build Tools API
        # in-process. See the top-of-file comment for the experiment that's
        # expected to settle this.
        #
        # `compileKotlinJs` and `compileKotlinWasmJs` are listed on the
        # chance that the tracer matches by binary name (kotlinc-js /
        # kotlinc-wasm) rather than strictly by JVM-target output. They
        # also haven't been observed to produce extraction; they remain
        # mostly for parity with sibling repos until the diagnosis is
        # complete. Native targets are not listed: the K/Native backend
        # produces no kotlinc exec the JVM-extractor tracer could match.
        #
        # `--rerun-tasks` defeats Gradle's up-to-date check;
        # `--no-build-cache` disables cache hits restored by setup-gradle;
        # `--no-configuration-cache --no-daemon` and the explicit
        # `kotlin.compiler.execution.strategy=out-of-process` are meant to
        # force a fresh kotlinc child process the tracer can hook —
        # but per the IMPLEMENTATION STATUS note above, this is the path
        # KGP is moving away from and the flags are not (yet) verified to
        # have the desired effect on the AGP-driven Android compile.
        run: |
          ./gradlew \
            compileAndroidMain \
            compileKotlinJs \
            compileKotlinWasmJs \
            --rerun-tasks \
            --no-build-cache \
            -Pkotlin.compiler.execution.strategy=out-of-process \
            --no-configuration-cache \
            --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
