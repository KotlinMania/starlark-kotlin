[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
bignum = "0.3.10"
syn = "0.3.11"
procMacro2 = "0.1.6"
quote = "0.2.5"
kotlinxBenchmark = "0.5.0"
# Sibling KotlinMania ports published to Maven Central
anyhow = "0.1.1"
clap = "0.1.1"
ctor = "0.1.0"
deriveMore = "0.1.0"
either = "0.1.1"
futures = "0.2.0"
globset = "0.1.2"
indexmap = "0.1.4"
itertools = "0.1.1"
lalrpopUtil = "0.1.1"
logos = "0.2.0"
onceCell = "0.1.1"
rand = "0.1.0"
regex = "0.1.0"
serde = "0.1.10"
serdeJson = "0.1.1"
starlarkMap = "0.1.3"
textwrap = "0.1.1"
thiserror = "0.2.0"
tokio = "0.1.1"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }
syn = { module = "io.github.kotlinmania:syn-kotlin", version.ref = "syn" }
proc-macro2 = { module = "io.github.kotlinmania:proc-macro2-kotlin", version.ref = "procMacro2" }
quote = { module = "io.github.kotlinmania:quote-kotlin", version.ref = "quote" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
# Sibling KotlinMania ports published to Maven Central
anyhow = { module = "io.github.kotlinmania:anyhow-kotlin", version.ref = "anyhow" }
clap = { module = "io.github.kotlinmania:clap-kotlin", version.ref = "clap" }
ctor = { module = "io.github.kotlinmania:ctor-kotlin", version.ref = "ctor" }
derive-more = { module = "io.github.kotlinmania:derive-more-kotlin", version.ref = "deriveMore" }
either = { module = "io.github.kotlinmania:either-kotlin", version.ref = "either" }
futures = { module = "io.github.kotlinmania:futures-kotlin", version.ref = "futures" }
globset = { module = "io.github.kotlinmania:globset-kotlin", version.ref = "globset" }
indexmap = { module = "io.github.kotlinmania:indexmap-kotlin", version.ref = "indexmap" }
itertools = { module = "io.github.kotlinmania:itertools-kotlin", version.ref = "itertools" }
lalrpop-util = { module = "io.github.kotlinmania:lalrpop-util-kotlin", version.ref = "lalrpopUtil" }
logos = { module = "io.github.kotlinmania:logos-kotlin", version.ref = "logos" }
once-cell = { module = "io.github.kotlinmania:once-cell-kotlin", version.ref = "onceCell" }
rand = { module = "io.github.kotlinmania:rand-kotlin", version.ref = "rand" }
regex = { module = "io.github.kotlinmania:regex-kotlin", version.ref = "regex" }
serde = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
serde-json = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serdeJson" }
starlark-map = { module = "io.github.kotlinmania:starlarkmap-kotlin", version.ref = "starlarkMap" }
textwrap = { module = "io.github.kotlinmania:textwrap-kotlin", version.ref = "textwrap" }
thiserror = { module = "io.github.kotlinmania:thiserror-kotlin", version.ref = "thiserror" }
tokio = { module = "io.github.kotlinmania:tokio-kotlin", version.ref = "tokio" }

[bundles]
starlark-commonMain = [
  "bignum",
  "syn",
  "proc-macro2",
  "quote",
  "kotlinx-coroutines-core",
  "kotlinx-datetime",
  "collections-immutable",
  "anyhow",
  "clap",
  "ctor",
  "derive-more",
  "either",
  "futures",
  "globset",
  "indexmap",
  "itertools",
  "lalrpop-util",
  "logos",
  "once-cell",
  "rand",
  "regex",
  "serde",
  "serde-json",
  "starlark-map",
  "textwrap",
  "thiserror",
  "tokio",
]
